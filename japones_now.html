<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語 Now">
<title>日本語 Now — Japonês para o dia a dia e o 現場</title>
<style>
:root{
  --bg:#0f1117; --card:#1a1e2a; --card2:#232838; --text:#e8eaf0; --muted:#8a91a5;
  --accent:#e94560; --accent2:#4ecca3; --blue:#4a9fe8; --amber:#e8b44a;
  --danger:#e05555; --hard:#e8964a; --good:#4ecca3; --easy:#4a9fe8;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI",sans-serif;
  overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
header h1{font-size:19px;font-weight:700}
header h1 span{color:var(--accent)}
.hdr-btns{display:flex;gap:8px}
.icon-btn{
  background:var(--card);border:1px solid #2c3245;color:var(--text);
  border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;
}
.icon-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;padding:8px 16px 32px;display:flex;flex-direction:column}
.hidden{display:none!important}

/* furigana */
ruby rt{font-size:0.5em;color:var(--muted);opacity:1;transition:opacity .15s}
body.no-furi ruby rt{opacity:0;visibility:hidden}

/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 18px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 8px;text-align:center}
.stat .num{font-size:26px;font-weight:800}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.stat.due .num{color:var(--accent)}
.stat.new .num{color:var(--accent2)}
.stat.streak .num{color:var(--amber)}
.deck-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.deck{
  background:var(--card);border-radius:var(--radius);padding:16px;display:flex;
  align-items:center;justify-content:space-between;cursor:pointer;border:1px solid transparent;
}
.deck.selected{border-color:var(--accent2)}
.deck .d-name{font-size:16px;font-weight:700}
.deck .d-sub{font-size:12px;color:var(--muted);margin-top:3px}
.deck .d-count{font-size:13px;color:var(--muted);text-align:right;line-height:1.5}
.deck .d-count b{color:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{
  border:none;border-radius:var(--radius);padding:18px 12px;font-size:16px;font-weight:700;
  color:#fff;cursor:pointer;text-align:center;line-height:1.3;
}
.mode-btn small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:4px}
.m-study{background:linear-gradient(135deg,#e94560,#c73652)}
.m-listen{background:linear-gradient(135deg,#4a9fe8,#3577b8)}
.m-shadow{background:linear-gradient(135deg,#9b59b6,#7d3f99)}
.m-browse{background:linear-gradient(135deg,#3d8f74,#2e6e59)}
.tip{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}

/* study */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.back{background:none;border:none;color:var(--blue);font-size:15px;font-weight:600;cursor:pointer;padding:6px}
.progress-txt{font-size:13px;color:var(--muted)}
.card-box{
  background:var(--card);border-radius:20px;padding:28px 20px;flex:1;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:300px;cursor:pointer;position:relative;
}
.card-tag{position:absolute;top:12px;left:14px;font-size:11px;color:var(--muted);background:var(--card2);padding:3px 10px;border-radius:10px}
.card-new-badge{position:absolute;top:12px;right:14px;font-size:11px;color:var(--accent2);background:rgba(78,204,163,.12);padding:3px 10px;border-radius:10px;font-weight:700}
.jp-main{font-size:34px;font-weight:700;line-height:1.7}
.jp-main.small{font-size:26px}
.answer{margin-top:18px;width:100%;border-top:1px solid #2c3245;padding-top:18px}
.pt-mean{font-size:20px;font-weight:700;color:var(--accent2)}
.reading{font-size:15px;color:var(--muted);margin-top:6px}
.example{margin-top:14px;background:var(--card2);border-radius:12px;padding:12px;font-size:17px;line-height:2}
.example .ex-pt{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.audio-btn{
  margin-top:16px;background:var(--card2);border:1px solid #2c3245;color:var(--blue);
  border-radius:24px;padding:10px 22px;font-size:15px;font-weight:600;cursor:pointer;
}
.reveal-hint{color:var(--muted);font-size:13px;margin-top:22px}
.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grade-btn{border:none;border-radius:14px;padding:14px 4px;font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.grade-btn small{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:2px}
.g-fail{background:var(--danger)} .g-hard{background:var(--hard)} .g-good{background:var(--good)} .g-easy{background:var(--easy)}
/* missão + dica */
.mission{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.mission h3{font-size:14px;margin-bottom:8px}
.mission h3 span{color:var(--amber)}
.m-item{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);padding:5px 0}
.m-item.done{color:var(--accent2)}
.m-item .mk{width:22px;height:22px;border-radius:50%;border:2px solid #3a4055;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.m-item.done .mk{background:var(--accent2);border-color:var(--accent2);color:#0f1117;font-weight:800}
.tip-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-top:14px;font-size:13px;color:var(--muted);line-height:1.6}
.tip-card b{color:var(--text)}
/* diálogos */
.dlg-line{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border-left:4px solid var(--blue)}
.dlg-line.spB{border-left-color:var(--accent)}
.dlg-line .dl-sp{font-size:11px;font-weight:700;color:var(--muted)}
.dlg-line .dl-jp{font-size:19px;line-height:2;margin-top:2px}
.dlg-line .dl-pt{font-size:12px;color:var(--muted);margin-top:4px}
.dlg-line.playing{background:var(--card2)}
/* praticar */
.opt-btn{
  display:block;width:100%;background:var(--card2);border:2px solid #2c3245;color:var(--text);
  border-radius:14px;padding:14px;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px;
  text-align:center;line-height:1.8;transition:border-color .15s,background .15s;
}
.opt-btn.correct{border-color:var(--good);background:rgba(78,204,163,.15)}
.opt-btn.wrong{border-color:var(--danger);background:rgba(224,85,85,.12)}
.opt-btn:disabled{cursor:default;opacity:.9}
.chunk-area{min-height:64px;background:var(--card2);border:2px dashed #3a4055;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.chunk{background:var(--card);border:1px solid #3a4055;color:var(--text);border-radius:10px;padding:8px 12px;font-size:18px;font-weight:600;cursor:pointer;line-height:1.9}
.chunk.placed{background:rgba(74,159,232,.15);border-color:var(--blue)}
.chunk-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.pr-type{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pr-feedback{text-align:center;font-size:15px;font-weight:700;margin-top:12px;min-height:22px}
.pr-feedback.ok{color:var(--good)} .pr-feedback.no{color:var(--danger)}
.done-box{text-align:center;padding:40px 20px}
.done-box .big{font-size:48px}
.done-box h2{margin:14px 0 8px}
.done-box p{color:var(--muted);font-size:14px;line-height:1.6}

/* listen */
.listen-card{background:var(--card);border-radius:20px;padding:30px 20px;text-align:center;margin-bottom:14px;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.listen-controls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:8px}
.ctrl-btn{background:var(--card);border:1px solid #2c3245;color:var(--text);border-radius:50%;width:56px;height:56px;font-size:20px;cursor:pointer}
.ctrl-btn.play{width:72px;height:72px;font-size:26px;background:var(--blue);border-color:var(--blue);color:#fff}
.listen-opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{background:var(--card);border:1px solid #2c3245;color:var(--muted);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:rgba(74,159,232,.15);border-color:var(--blue);color:var(--blue)}

/* browse */
.search{width:100%;background:var(--card);border:1px solid #2c3245;border-radius:12px;padding:12px 14px;color:var(--text);font-size:16px;margin-bottom:10px}
.browse-item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.browse-item .b-jp{font-size:19px;line-height:1.9;font-weight:600}
.browse-item .b-pt{font-size:12px;color:var(--muted);margin-top:2px}
.b-play{background:none;border:none;color:var(--blue);font-size:20px;cursor:pointer;padding:6px}

/* settings */
.set-row{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.set-row .s-lbl{font-size:15px;font-weight:600}
.set-row .s-sub{font-size:12px;color:var(--muted);margin-top:2px}
select,input[type=number]{background:var(--card2);color:var(--text);border:1px solid #2c3245;border-radius:8px;padding:8px;font-size:15px}
.switch{position:relative;width:52px;height:30px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider-sw{position:absolute;inset:0;background:#3a4055;border-radius:30px;transition:.2s;cursor:pointer}
.slider-sw:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider-sw{background:var(--accent2)}
.switch input:checked + .slider-sw:before{transform:translateX(22px)}
.wide-btn{width:100%;background:var(--card);border:1px solid #2c3245;color:var(--blue);border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--card2);
  color:var(--text);padding:12px 22px;border-radius:24px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.4);
  z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>日本語 <span>Now</span></h1>
    <div class="hdr-btns">
      <button class="icon-btn" id="furiBtn" onclick="toggleFuri()">ふりがな</button>
      <button class="icon-btn" onclick="showScreen('settings')">⚙︎</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   日本語 Now — app de estudo de japonês (SRS + furigana + áudio)
   Conteúdo: dia a dia em Tokyo + 現場 (eletricista)
   ============================================================ */

// ---------- DADOS ----------
// formato furigana: 漢字[かんじ] → <ruby>
const DECKS = [
  { id:"genba", name:"現場・Trabalho", sub:"Obra, elétrica, segurança, instruções", cards:[
{j:"お疲[つか]れ様[さま]です",pt:"obrigado pelo trabalho (saudação universal no trabalho)",ex:"お疲[つか]れ様[さま]です。今日[きょう]も暑[あつ]いですね。",exPt:"Otsukaresama desu. Hoje também está quente, né."},
{j:"お先[さき]に失礼[しつれい]します",pt:"com licença, vou indo antes (ao sair do trabalho)",ex:"お先[さき]に失礼[しつれい]します。また明日[あした]。",exPt:"Vou indo antes. Até amanhã."},
{j:"よろしくお願[ねが]いします",pt:"conto com você / prazer (início de trabalho conjunto)",ex:"今日[きょう]からよろしくお願[ねが]いします。",exPt:"A partir de hoje, conto com vocês."},
{j:"朝礼[ちょうれい]",pt:"reunião matinal (antes de começar o trabalho)",ex:"朝礼[ちょうれい]は八時[はちじ]からです。",exPt:"A reunião matinal começa às 8h."},
{j:"KY活動[かつどう]",pt:"atividade de prevenção de riscos (危険予知 = prever perigos)",ex:"作業[さぎょう]の前[まえ]にKY活動[かつどう]をします。",exPt:"Antes do trabalho, fazemos a atividade de prevenção de riscos."},
{j:"現場[げんば]",pt:"canteiro de obras / local de trabalho",ex:"明日[あした]の現場[げんば]は新宿[しんじゅく]です。",exPt:"O canteiro de amanhã é em Shinjuku."},
{j:"親方[おやかた]",pt:"chefe / mestre de obra",ex:"親方[おやかた]に聞[き]いてください。",exPt:"Pergunte ao chefe."},
{j:"職人[しょくにん]",pt:"profissional / artesão qualificado",ex:"彼[かれ]はベテランの職人[しょくにん]です。",exPt:"Ele é um profissional veterano."},
{j:"作業[さぎょう]",pt:"trabalho / tarefa / operação",ex:"作業[さぎょう]を始[はじ]めます。",exPt:"Vou começar o trabalho."},
{j:"休憩[きゅうけい]",pt:"pausa / descanso",ex:"十時[じゅうじ]に休憩[きゅうけい]しましょう。",exPt:"Vamos fazer pausa às 10h."},
{j:"残業[ざんぎょう]",pt:"hora extra",ex:"今日[きょう]は残業[ざんぎょう]がありますか。",exPt:"Hoje tem hora extra?"},
{j:"安全[あんぜん]第一[だいいち]",pt:"segurança em primeiro lugar",ex:"現場[げんば]では安全[あんぜん]第一[だいいち]です。",exPt:"No canteiro, segurança em primeiro lugar."},
{j:"危[あぶ]ない！",pt:"cuidado! / perigo!",ex:"危[あぶ]ない！上[うえ]を見[み]て！",exPt:"Cuidado! Olhe para cima!"},
{j:"気[き]をつけてください",pt:"tome cuidado, por favor",ex:"足元[あしもと]に気[き]をつけてください。",exPt:"Cuidado onde pisa."},
{j:"ヘルメット",pt:"capacete",ex:"ヘルメットをかぶってください。",exPt:"Use o capacete, por favor."},
{j:"安全帯[あんぜんたい]",pt:"cinto de segurança (trabalho em altura)",ex:"高[たか]い所[ところ]では安全帯[あんぜんたい]を使[つか]います。",exPt:"Em lugares altos, usamos o cinto de segurança."},
{j:"軍手[ぐんて]",pt:"luvas de trabalho",ex:"軍手[ぐんて]を持[も]ってきましたか。",exPt:"Você trouxe as luvas?"},
{j:"安全靴[あんぜんぐつ]",pt:"botas de segurança",ex:"現場[げんば]では安全靴[あんぜんぐつ]が必要[ひつよう]です。",exPt:"No canteiro é obrigatório usar botas de segurança."},
{j:"感電[かんでん]",pt:"choque elétrico",ex:"感電[かんでん]に注意[ちゅうい]してください。",exPt:"Cuidado com choque elétrico."},
{j:"停電[ていでん]",pt:"queda de energia / corte de luz",ex:"午後[ごご]から停電[ていでん]します。",exPt:"A energia será cortada à tarde."},
{j:"立入禁止[たちいりきんし]",pt:"entrada proibida (placa)",ex:"ここは立入禁止[たちいりきんし]です。",exPt:"Aqui é proibida a entrada."},
{j:"指差[ゆびさ]し確認[かくにん]",pt:"verificação apontando o dedo (procedimento de segurança)",ex:"スイッチを切[き]る時[とき]、指差[ゆびさ]し確認[かくにん]をします。",exPt:"Ao desligar o interruptor, faço a verificação apontando."},
{j:"火気厳禁[かきげんきん]",pt:"proibido fogo (placa)",ex:"この倉庫[そうこ]は火気厳禁[かきげんきん]です。",exPt:"Neste depósito é proibido fogo."},
{j:"高所作業[こうしょさぎょう]",pt:"trabalho em altura",ex:"明日[あした]は高所作業[こうしょさぎょう]があります。",exPt:"Amanhã tem trabalho em altura."},
{j:"足場[あしば]",pt:"andaime",ex:"足場[あしば]の上[うえ]で作業[さぎょう]します。",exPt:"Vou trabalhar em cima do andaime."},
{j:"脚立[きゃたつ]",pt:"escada tipo A",ex:"脚立[きゃたつ]を押[お]さえてください。",exPt:"Segure a escada, por favor."},
{j:"工具[こうぐ]",pt:"ferramenta",ex:"工具[こうぐ]を片付[かたづ]けてください。",exPt:"Guarde as ferramentas, por favor."},
{j:"ペンチ",pt:"alicate",ex:"ペンチを貸[か]してください。",exPt:"Me empresta o alicate?"},
{j:"ニッパー",pt:"alicate de corte",ex:"ニッパーで電線[でんせん]を切[き]ります。",exPt:"Corto o fio com o alicate de corte."},
{j:"ドライバー",pt:"chave de fenda (geral)",ex:"ドライバーはどこですか。",exPt:"Onde está a chave de fenda?"},
{j:"プラスドライバー",pt:"chave phillips",ex:"プラスドライバーを取[と]ってください。",exPt:"Pega a chave phillips pra mim."},
{j:"マイナスドライバー",pt:"chave de fenda comum",ex:"マイナスドライバーの方[ほう]がいいです。",exPt:"É melhor a chave de fenda comum."},
{j:"モンキーレンチ",pt:"chave inglesa ajustável",ex:"モンキーレンチで締[し]めます。",exPt:"Aperto com a chave inglesa."},
{j:"電動[でんどう]ドリル",pt:"furadeira elétrica",ex:"電動[でんどう]ドリルで穴[あな]を開[あ]けます。",exPt:"Faço o furo com a furadeira."},
{j:"メジャー",pt:"trena",ex:"メジャーで長[なが]さを測[はか]ってください。",exPt:"Meça o comprimento com a trena."},
{j:"カッター",pt:"estilete",ex:"カッターの刃[は]に気[き]をつけて。",exPt:"Cuidado com a lâmina do estilete."},
{j:"絶縁[ぜつえん]テープ",pt:"fita isolante",ex:"絶縁[ぜつえん]テープを巻[ま]いてください。",exPt:"Enrole com fita isolante."},
{j:"検電器[けんでんき]",pt:"detector de tensão",ex:"検電器[けんでんき]で確認[かくにん]してから触[さわ]ります。",exPt:"Só toco depois de verificar com o detector de tensão."},
{j:"圧着[あっちゃく]工具[こうぐ]",pt:"alicate de crimpar",ex:"圧着[あっちゃく]工具[こうぐ]で端子[たんし]をつけます。",exPt:"Fixo o terminal com o alicate de crimpar."},
{j:"電気[でんき]",pt:"eletricidade / luz",ex:"電気[でんき]をつけてください。",exPt:"Acenda a luz, por favor."},
{j:"電気工事[でんきこうじ]",pt:"instalação elétrica / obra elétrica",ex:"来週[らいしゅう]、電気工事[でんきこうじ]があります。",exPt:"Semana que vem tem obra elétrica."},
{j:"電気工事士[でんきこうじし]",pt:"eletricista (qualificação oficial no Japão)",ex:"電気工事士[でんきこうじし]の資格[しかく]を取[と]りたいです。",exPt:"Quero tirar a qualificação de eletricista."},
{j:"電線[でんせん]",pt:"fio elétrico",ex:"この電線[でんせん]は古[ふる]いです。",exPt:"Este fio é velho."},
{j:"ケーブル",pt:"cabo",ex:"ケーブルを引[ひ]っ張[ぱ]らないでください。",exPt:"Não puxe o cabo."},
{j:"配線[はいせん]",pt:"fiação",ex:"配線[はいせん]を確認[かくにん]します。",exPt:"Vou verificar a fiação."},
{j:"コンセント",pt:"tomada",ex:"コンセントを取[と]り付[つ]けます。",exPt:"Vou instalar a tomada."},

// ---------- ESTADO ----------
const LS_KEY = "nihongoNow_v1";
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(s && s.cards){ if(!s.errors) s.errors = {}; return s; }
  }catch(e){}
  return { cards:{}, settings:{ newPerDay:10, furi:true, autoAudio:true, ptVoice:true }, days:{}, streak:{last:null,count:0}, errors:{} };
}
function addError(j){ state.errors[j] = (state.errors[j]||0) + 1; save(); }
function clearError(j){ if(state.errors[j]){ state.errors[j]--; if(state.errors[j]<=0) delete state.errors[j]; save(); } }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function today(){ return new Date().toISOString().slice(0,10); }
function dayLog(){ const t=today(); if(!state.days[t]) state.days[t]={new:0,rev:0,study:false,practice:false,listen:0,dialog:false}; return state.days[t]; }
function bumpStreak(){
  const t=today(), st=state.streak;
  if(st.last===t) return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  st.count = (st.last===y) ? st.count+1 : 1;
  st.last = t;
}

// cada cartão: chave deckId:index → {iv: intervalo(dias), ease, due:"YYYY-MM-DD", reps, lapses, state:"new|learn|rev"}
function cardKey(d,i){ return d+":"+i; }
function getCS(key){
  if(!state.cards[key]) state.cards[key] = { iv:0, ease:2.5, due:null, reps:0, lapses:0, st:"new", step:0 };
  return state.cards[key];
}

// ---------- SRS (algoritmo estilo Anki/SM-2) ----------
// Estados: new → learn (2 passos na sessão) → rev; lapso em rev → relearn → rev
// g: 1 Errei (Again), 2 Difícil (Hard), 3 Bom (Good), 4 Fácil (Easy)
function grade(cs, g){
  const t = today();
  const setDue = d=>{ const x = new Date(); x.setDate(x.getDate()+d); cs.due = x.toISOString().slice(0,10); };
  if(cs.st==="new"){ cs.st = "learn"; cs.step = 0; }
  if(cs.st==="learn"){
    if(g===1){ cs.step = 0; cs.due = t; }                       // Again: recomeça os passos, revê hoje
    else if(g===2){ cs.due = t; }                               // Hard: repete o passo atual, revê hoje
    else if(g===3){
      cs.step = (cs.step||0) + 1;
      if(cs.step>=2){ cs.st = "rev"; cs.iv = 1; setDue(1); }    // Good 2×: forma com 1 dia
      else { cs.due = t; }                                      // próximo passo ainda hoje
    }
    else { cs.st = "rev"; cs.iv = 4; setDue(4); }               // Easy: forma direto com 4 dias
  } else if(cs.st==="relearn"){
    if(g===1){ cs.due = t; }                                    // Again: repete o passo hoje
    else if(g===2){ cs.due = t; }                               // Hard: repete o passo hoje
    else if(g===3){ cs.st = "rev"; cs.iv = 1; setDue(1); }      // Good: volta às revisões com 1 dia
    else { cs.st = "rev"; cs.iv = 2; setDue(2); }               // Easy: volta com 2 dias
  } else { // rev
    if(g===1){                                                  // lapso
      cs.lapses++; cs.ease = Math.max(1.3, cs.ease - 0.20);
      cs.st = "relearn"; cs.due = t;
    } else {
      if(g===2){ cs.iv = Math.max(cs.iv+1, Math.round(cs.iv*1.2)); cs.ease = Math.max(1.3, cs.ease - 0.15); }
      if(g===3){ cs.iv = Math.max(cs.iv+1, Math.round(cs.iv*cs.ease)); }
      if(g===4){ cs.iv = Math.max(cs.iv+1, Math.round(cs.iv*cs.ease*1.3)); cs.ease += 0.15; }
      cs.iv = Math.min(cs.iv, 365);
      setDue(cs.iv);
    }
  }
  cs.reps++;
}
function ivPreview(cs, g){
  if(cs.st==="new"||cs.st==="learn"){
    const step = cs.st==="new" ? 0 : (cs.step||0);
    if(g===1) return "agora";
    if(g===2) return "logo";
    if(g===3) return step>=1 ? "1 d" : "hoje";
    return "4 d";
  }
  if(cs.st==="relearn"){
    return g===1 ? "agora" : g===2 ? "logo" : g===3 ? "1 d" : "2 d";
  }
  if(g===1) return "agora";
  if(g===2) return Math.max(cs.iv+1,Math.round(cs.iv*1.2))+" d";
  if(g===3) return Math.max(cs.iv+1,Math.round(cs.iv*cs.ease))+" d";
  return Math.max(cs.iv+1,Math.round(cs.iv*cs.ease*1.3))+" d";
}

// ---------- FURIGANA ----------
function rubyHTML(str){
  return esc(str).replace(/([一-鿿㐀-䶿々〆ヶ]+)\[([^\]]+)\]/g,
    "<ruby>$1<rt>$2</rt></ruby>");
}
function plainJP(str){ return str.replace(/\[[^\]]+\]/g,""); }
function kanaOnly(str){
  // devolve leitura em kana: troca 漢字[かな] por かな
  return str.replace(/([一-鿿㐀-䶿々〆ヶ]+)\[([^\]]+)\]/g,"$2");
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function applyFuri(){
  document.body.classList.toggle("no-furi", !state.settings.furi);
  document.getElementById("furiBtn").classList.toggle("active", state.settings.furi);
}
function toggleFuri(){ state.settings.furi = !state.settings.furi; save(); applyFuri(); }

// ---------- ÁUDIO (TTS) ----------
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
loadVoices();
if(typeof speechSynthesis!=="undefined") speechSynthesis.onvoiceschanged = loadVoices;
function pickVoice(lang){
  const pref = voices.filter(v=>v.lang && v.lang.replace("_","-").startsWith(lang));
  if(!pref.length) return null;
  // prioriza vozes aprimoradas
  return pref.find(v=>/enhanced|premium|siri/i.test(v.name)) || pref[0];
}
let speakSeq = 0;
function speak(text, lang, rate, onend){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  const v = pickVoice(lang); if(v) u.voice = v;
  u.rate = rate || (lang==="ja-JP" ? 0.9 : 1.0);
  if(onend) u.onend = onend;
  speechSynthesis.speak(u);
  return u;
}
function stopSpeak(){ speechSynthesis.cancel(); }
function speakJP(str, rate, onend){ return speak(plainJP(str), "ja-JP", rate, onend); }

// ---------- HOME ----------
function counts(){
  const t = today();
  let due=0, learned=0, totNew=0;
  DECKS.forEach(d=>d.cards.forEach((c,i)=>{
    const cs = state.cards[cardKey(d.id,i)];
    if(!cs || cs.st==="new"){ totNew++; return; }
    learned++;
    if(cs.due && cs.due<=t) due++;
  }));
  return {due, learned, totNew};
}
function deckCounts(d){
  const t=today(); let due=0, nw=0;
  d.cards.forEach((c,i)=>{
    const cs=state.cards[cardKey(d.id,i)];
    if(!cs||cs.st==="new") nw++;
    else if(cs.due && cs.due<=t) due++;
  });
  return {due,nw};
}
function missionHTML(){
  const dl = dayLog();
  const c = counts();
  const m1 = dl.study || (c.due===0 && dl.rev+dl.new>0);
  const m2 = dl.practice;
  const m3 = dl.listen>=10 || dl.dialog;
  const all = m1&&m2&&m3;
  return `<div class="mission">
    <h3>${all?"🎌 Missão do dia completa! すごい！":"⚡ <span>Missão do dia</span>"}</h3>
    <div class="m-item ${m1?"done":""}"><span class="mk">${m1?"✓":"1"}</span> Estudar: zerar as revisões do dia</div>
    <div class="m-item ${m2?"done":""}"><span class="mk">${m2?"✓":"2"}</span> Praticar: 1 rodada de exercícios</div>
    <div class="m-item ${m3?"done":""}"><span class="mk">${m3?"✓":"3"}</span> Ouvir: 10 frases ou 1 diálogo completo</div>
  </div>`;
}

}

let queue = [], qi = 0, revealed = false;
function buildQueue(){
  const t = today();
  const dl = dayLog();
  let newLeft = Math.max(0, state.settings.newPerDay - dl.new);
  const due = [], news = [];
  activeDecks().forEach(d=>d.cards.forEach((c,i)=>{
    const key = cardKey(d.id,i);
    const cs = state.cards[key];
    if(!cs || cs.st==="new"){ news.push({deck:d,card:c,key,idx:i}); }
    else if(cs.due && cs.due<=t){ due.push({deck:d,card:c,key,idx:i}); }
  }));
  // intercala: revisões primeiro, depois novos
  queue = due.concat(news.slice(0, newLeft));
}
function startStudy(){
  buildQueue(); qi = 0;
  renderStudyCard();
}
function renderStudyCard(){
  if(qi >= queue.length){
    const dl = dayLog();
    if(dl.rev+dl.new>0){ dl.study = true; save(); }
    main.innerHTML = `

      <div class="done-box">

        <button class="wide-btn" onclick="extraNew()">＋10 cartões novos extras</button>

    return;
  }
  revealed = false;
  const item = queue[qi];
  const cs = getCS(item.key);
  const isNew = cs.st==="new";
  main.innerHTML = `
    <div class="top-bar">
      <button class="back" onclick="showScreen('home')">‹ Início</button>
      <span class="progress-txt">${qi+1} / ${queue.length}</span>

function reveal(){
  if(revealed) return;
  revealed = true;
  const item = queue[qi];
  const cs = getCS(item.key);
  const kana = kanaOnly(item.card.j);
  const showReading = kana !== plainJP(item.card.j);
  document.getElementById("ansArea").innerHTML = `
    <div class="answer">
      <div class="pt-mean">${esc(item.card.pt)}</div>
      ${showReading?`<div class="reading">${esc(kana)}</div>`:""}

    </div>`;
  document.getElementById("gradeArea").innerHTML = `
    <div class="grade-row">
      <button class="grade-btn g-fail" onclick="doGrade(1)">Errei<small>${ivPreview(cs,1)}</small></button>
      <button class="grade-btn g-hard" onclick="doGrade(2)">Difícil<small>${ivPreview(cs,2)}</small></button>
      <button class="grade-btn g-good" onclick="doGrade(3)">Bom<small>${ivPreview(cs,3)}</small></button>
      <button class="grade-btn g-easy" onclick="doGrade(4)">Fácil<small>${ivPreview(cs,4)}</small></button>
    </div>`;
  if(state.settings.autoAudio && item.card.ex) setTimeout(()=>speakJP(item.card.ex, 0.85), 200);

function replayAudio(){
  const item = queue[qi];
  stopSpeak();
  speakJP(item.card.j, 0.9, ()=>{ if(item.card.ex) speakJP(item.card.ex, 0.85); });
}
function doGrade(g){
  const item = queue[qi];
  const cs = getCS(item.key);
  const wasNew = cs.st==="new";
  grade(cs, g);
  if(g===1) addError(item.card.j);
  const dl = dayLog();
  if(wasNew) dl.new++; else dl.rev++;
  bumpStreak();
  // cartão em aprendizagem/reaprendizagem com passo hoje → volta alguns cartões à frente (como os minutos do Anki)
  if(cs.due === today() && cs.st !== "rev"){
    queue.splice(Math.min(qi + 4, queue.length), 0, item);
  }
  save();
  qi++;
  renderStudyCard();
}

const PR_LEN = 10;
const PARTICLES = ["から","まで","を","が","は","に","で","と"];
let prQs = [], prIdx = 0, prScore = 0, prLocked = false, prBuild = null, prCurType = "mix";

function prPool(){
  const pool = [];
  activeDecks().forEach(d=>d.cards.forEach(c=>pool.push(c)));
  return pool;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(arr,n,not){
  const c = arr.filter(x=>x!==not); shuffle(c); return c.slice(0,n);
}
// acha uma partícula fora dos colchetes, logo após ] ou katakana
function findParticle(ex){
  let inB=false;
  for(let i=1;i<ex.length;i++){
    const ch=ex[i];
    if(ch==="["){inB=true;continue}
    if(ch==="]"){inB=false;continue}
    if(inB) continue;
    const prev=ex[i-1];
    if(!(prev==="]"||/[ァ-ヶー]/.test(prev))) continue;
    for(const p of PARTICLES){ if(ex.startsWith(p,i)) return {i,p}; }
  }
  return null;
}
// divide frase em pedaços: grupo kanji[furi]/katakana + hiragana seguinte
function chunkEx(ex){
  const toks = ex.match(/[一-鿿々〆ヶ]+\[[^\]]+\]|[ぁ-ん]+|[ァ-ヶー]+|[A-Za-z0-9０-９]+|[。、！？「」〜・]+/g)||[];
  const chunks=[];
  toks.forEach(t=>{
    const glue=/^[ぁ-ん]+$/.test(t)||/^[。、！？「」〜・]+$/.test(t);
    if(glue && chunks.length) chunks[chunks.length-1]+=t;
    else chunks.push(t);
  });
  return chunks;
}
function genQ(type, pool, tp){
  tp = (tp && tp.length) ? tp : pool; // tp = de onde sai a pergunta; pool = distratores
  const exPool = tp.filter(c=>c.ex);
  if(type==="mc_jp"){
    const c = tp[Math.floor(Math.random()*tp.length)];
    return {type, card:c, opts: shuffle([c.pt, ...pick(pool.map(x=>x.pt),3,c.pt)]), ans:c.pt};
  }
  if(type==="mc_pt"){
    const c = tp[Math.floor(Math.random()*tp.length)];
    return {type, card:c, opts: shuffle([c.j, ...pick(pool.map(x=>x.j),3,c.j)]), ans:c.j};
  }
  if(type==="listen"){
    const c = exPool.length?exPool[Math.floor(Math.random()*exPool.length)]:tp[Math.floor(Math.random()*tp.length)];
    return {type, card:c, opts: shuffle([c.pt, ...pick(pool.map(x=>x.pt),3,c.pt)]), ans:c.pt};
  }
  if(type==="particle"){
    for(let t=0;t<60;t++){
      const c = exPool[Math.floor(Math.random()*exPool.length)];
      const f = c && findParticle(c.ex);
      if(f){
        const opts = shuffle([f.p, ...pick(PARTICLES,3,f.p)]);
        return {type, card:c, blank: c.ex.slice(0,f.i)+"〔　？　〕"+c.ex.slice(f.i+f.p.length), opts, ans:f.p};
      }
    }
    return genQ("mc_jp", pool);
  }
  if(type==="build"){
    for(let t=0;t<60;t++){
      const c = exPool[Math.floor(Math.random()*exPool.length)];
      const chunks = c && chunkEx(c.ex);
      if(chunks && chunks.length>=3 && chunks.length<=8){
        let bank = shuffle(chunks.slice());
        if(bank.join("")===chunks.join("")) bank = shuffle(bank);
        return {type, card:c, chunks, bank};
      }
    }
    return genQ("mc_jp", pool);
  }
}

      <p class="tip" style="margin:8px 0 0">Qual partícula completa a frase?</p>
      <div id="optArea" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
        ${q.opts.map((o,i)=>`<button class="opt-btn" data-i="${i}" style="margin-top:0;font-size:22px" onclick="prAnswer(this,${i})">${esc(o)}</button>`).join("")}
      </div>
      <div class="pr-feedback" id="prFb"></div>`;
  }
  if(q.type==="build"){
    prBuild = { placed:[], bank:q.bank.map((c,i)=>({txt:c,used:false,id:i})) };
    main.innerHTML = head + `
      <p class="tip" style="margin:4px 0 0">Monte a frase: <b>${esc(q.card.exPt||q.card.pt)}</b></p>
      <div class="chunk-area" id="chunkArea"></div>
      <div class="chunk-bank" id="chunkBank"></div>
      <button class="wide-btn" id="checkBtn" onclick="prCheckBuild()" style="background:var(--accent);color:#fff;border:none">Verificar</button>
      <div class="pr-feedback" id="prFb"></div>`;
    renderBuild();
  }
}
function renderBuild(){
  const q = prQs[prIdx];
  document.getElementById("chunkArea").innerHTML =
    prBuild.placed.map((id,pos)=>`<span class="chunk placed" onclick="prUnplace(${pos})">${rubyHTML(prBuild.bank[id].txt)}</span>`).join("") ||
    `<span style="color:var(--muted);font-size:13px">toque nos pedaços abaixo, na ordem</span>`;
  document.getElementById("chunkBank").innerHTML =
    prBuild.bank.map((b,i)=>b.used?"":`<span class="chunk" onclick="prPlace(${i})">${rubyHTML(b.txt)}</span>`).join("");
}
function prPlace(i){ if(prLocked||prBuild.bank[i].used) return; prBuild.bank[i].used=true; prBuild.placed.push(i); renderBuild(); }
function prUnplace(pos){ if(prLocked) return; const id=prBuild.placed.splice(pos,1)[0]; prBuild.bank[id].used=false; renderBuild(); }
function prCheckBuild(){
  if(prLocked) return;
  const q = prQs[prIdx];
  const built = prBuild.placed.map(id=>prBuild.bank[id].txt).join("");
  const ok = built === q.chunks.join("");
  prLocked = true;
  const fb = document.getElementById("prFb");
  fb.className = "pr-feedback " + (ok?"ok":"no");
  fb.innerHTML = (ok?"⭕ Correto! ":"❌ Quase! Resposta: ") + `<span style="font-size:17px">${rubyHTML(q.card.ex)}</span>`;
  if(ok) prScore++; else addError(q.card.j);
  speakJP(q.card.ex, 0.85);
  setTimeout(()=>{prIdx++;renderPrQ();}, ok?1800:3200);
}
function prAnswer(btn, idx){
  if(prLocked) return;
  prLocked = true;
  const q = prQs[prIdx];
  const chosen = q.opts[idx];
  const ok = chosen === q.ans;
  const ansIdx = q.opts.indexOf(q.ans);
  document.querySelectorAll(".opt-btn").forEach(b=>{
    b.disabled = true;
    if(parseInt(b.getAttribute("data-i"))===ansIdx) b.classList.add("correct");
  });
  if(!ok) btn.classList.add("wrong");
  const fb = document.getElementById("prFb");
  fb.className = "pr-feedback " + (ok?"ok":"no");
  fb.textContent = ok ? "⭕ 正解！ Correto!" : "❌ Resposta certa: " + plainJP(q.ans);
  if(ok){ prScore++; if(prCurType==="errors") clearError(q.card.j); }
  else addError(q.card.j);
  if(q.type!=="listen") speakJP(q.card.j, 0.9);
  setTimeout(()=>{prIdx++;renderPrQ();}, ok?1200:2600);
}

// ---------- DIÁLOGOS ----------
let dlgPlaying = false;
function renderDialogs(idx){
  if(typeof idx === "number"){ renderDialogDetail(idx); return; }
  main.innerHTML = `
    <div class="top-bar"><button class="back" onclick="showScreen('home')">‹ Início</button><span></span></div>
    <p style="font-weight:700;font-size:17px;margin:4px 4px 2px">Diálogos de situações reais</p>
    <p style="color:var(--muted);font-size:13px;margin:0 4px 12px">Ouça, leia e repita — depois tente falar sua parte sozinho</p>
    ${DIALOGUES.map((d,i)=>`<div class="deck" onclick="showScreen('dialogs',${i})">
      <div><div class="d-name">${rubyHTML(d.t)}</div><div class="d-sub">${esc(d.pt)} · ${d.lines.length} falas</div></div>
      <div class="d-count">›</div>
    </div>`).join("")}`;
}
function renderDialogDetail(idx){
  const d = DIALOGUES[idx];
  main.innerHTML = `
    <div class="top-bar"><button class="back" onclick="showScreen('dialogs')">‹ Diálogos</button><span></span></div>
    <p style="font-weight:700;font-size:17px;margin:4px 4px 10px;line-height:1.9">${rubyHTML(d.t)}</p>
    ${d.lines.map((l,i)=>`<div class="dlg-line ${l.s==="B"?"spB":""}" id="dlgL${i}" onclick="dlgLine(${idx},${i})">
      <div class="dl-sp">${l.s==="A"?"🔵 A":"🔴 B"}</div>
      <div class="dl-jp">${rubyHTML(l.j)}</div>
      <div class="dl-pt">${esc(l.pt)}</div>
    </div>`).join("")}
    <button class="wide-btn" style="background:var(--blue);color:#fff;border:none" onclick="dlgPlayAll(${idx})" id="dlgAllBtn">▶︎ Ouvir o diálogo inteiro</button>
    <p class="tip">Toque em cada fala para ouvir.<br>Desafio: cubra o português e tente entender só pelo japonês.</p>`;
}
function dlgLine(idx,i){
  dlgPlaying = false;
  stopSpeak();
  highlightLine(i);
  speakJP(DIALOGUES[idx].lines[i].j, 0.85, ()=>highlightLine(-1));
}
function highlightLine(i){
  document.querySelectorAll(".dlg-line").forEach((el,k)=>el.classList.toggle("playing", k===i));
}
function dlgPlayAll(idx){
  const d = DIALOGUES[idx];
  if(dlgPlaying){ dlgPlaying=false; stopSpeak(); highlightLine(-1); const b=document.getElementById("dlgAllBtn"); if(b)b.textContent="▶︎ Ouvir o diálogo inteiro"; return; }
  dlgPlaying = true;
  const b = document.getElementById("dlgAllBtn"); if(b) b.textContent = "⏸ Parar";
  let i = 0;
  const next = ()=>{
    if(!dlgPlaying) return;
    if(i >= d.lines.length){
      dlgPlaying = false; highlightLine(-1);
      const dl = dayLog(); dl.dialog = true; save();
      const bb = document.getElementById("dlgAllBtn"); if(bb) bb.textContent = "✓ Concluído! Ouvir de novo";
      return;
    }
    highlightLine(i);
    speakJP(d.lines[i].j, 0.85, ()=>{ i++; setTimeout(next, 600); });
  };
  next();
}

// ---------- NAVEGAR ----------
function renderBrowse(){
  main.innerHTML = `
    <div class="top-bar"><button class="back" onclick="showScreen('home')">‹ Início</button><span></span></div>
    <input class="search" id="searchBox" placeholder="Buscar (japonês ou português)…" oninput="renderBrowseList()">
    <div id="browseList"></div>
  `;
  renderBrowseList();
}
function renderBrowseList(){
  const q = (document.getElementById("searchBox").value||"").toLowerCase();
  let html = "";
  activeDecks().forEach(d=>{
    const items = d.cards.map((c,i)=>({c,i})).filter(({c})=>{
      if(!q) return true;
      return plainJP(c.j).includes(q) || kanaOnly(c.j).includes(q) ||
             c.pt.toLowerCase().includes(q) || (c.ex && plainJP(c.ex).includes(q));
    });
    if(!items.length) return;
    html += `<p style="color:var(--muted);font-size:12px;font-weight:700;margin:14px 4px 8px">${d.name} (${items.length})</p>`;
    items.forEach(({c,i})=>{
      const cs = state.cards[cardKey(d.id,i)];
      const learned = cs && cs.st!=="new";
      html += `<div class="browse-item">
        <div><div class="b-jp">${learned?"":"<span style='color:var(--accent2)'>● </span>"}${rubyHTML(c.j)}</div>
        <div class="b-pt">${esc(c.pt)}</div></div>
        <button class="b-play" onclick='speakJP(${JSON.stringify(c.j)},0.9)'>🔊</button>
      </div>`;
    });
  });
  document.getElementById("browseList").innerHTML = html || "<p class='tip'>Nada encontrado.</p>";
}

// ---------- CONFIGURAÇÕES ----------
function renderSettings(){
  const s = state.settings;
  const c = counts();
  main.innerHTML = `
    <div class="top-bar"><button class="back" onclick="showScreen('home')">‹ Início</button><span></span></div>
    <div class="set-row">
      <div><div class="s-lbl">Furigana</div><div class="s-sub">Mostrar leitura em cima dos kanjis</div></div>
      <label class="switch"><input type="checkbox" ${s.furi?"checked":""} onchange="toggleFuri()"><span class="slider-sw"></span></label>
    </div>
    <div class="set-row">
      <div><div class="s-lbl">Áudio automático</div><div class="s-sub">Ler o cartão ao aparecer</div></div>
      <label class="switch"><input type="checkbox" ${s.autoAudio?"checked":""} onchange="state.settings.autoAudio=this.checked;save()"><span class="slider-sw"></span></label>
    </div>
    <div class="set-row">
      <div><div class="s-lbl">Novos por dia</div><div class="s-sub">10 = ~15-20 min/dia com revisões</div></div>
      <input type="number" min="1" max="50" value="${s.newPerDay}" style="width:70px;text-align:center"
        onchange="state.settings.newPerDay=Math.max(1,parseInt(this.value)||10);save()">
    </div>
    <div class="set-row">
      <div><div class="s-lbl">Progresso</div><div class="s-sub">${c.learned} aprendidos · ${c.totNew} restantes · sequência ${state.streak.count||0} dias</div></div>
    </div>
    <button class="wide-btn" onclick="exportProgress()">📤 Copiar backup do progresso</button>
    <button class="wide-btn" onclick="importProgress()">📥 Restaurar backup</button>
    <button class="wide-btn" style="color:var(--danger)" onclick="if(confirm('Apagar todo o progresso?')){localStorage.removeItem(LS_KEY);state=load();save();toast('Progresso apagado');renderSettings();}">🗑 Zerar progresso</button>
    <p class="tip">Feito para iPhone: no Safari toque em <b>Compartilhar → Adicionar à Tela de Início</b><br>para usar como app, em tela cheia e offline.</p>
  `;
}
function exportProgress(){
  const data = JSON.stringify(state);
  if(navigator.clipboard){ navigator.clipboard.writeText(data).then(()=>toast("Backup copiado! Cole em uma nota.")); }
  else prompt("Copie este texto:", data);
}
function importProgress(){
  const data = prompt("Cole aqui o backup:");
  if(!data) return;
  try{ const s = JSON.parse(data); if(s.cards){ state = s; save(); applyFuri(); toast("Backup restaurado ✓"); renderSettings(); } }
  catch(e){ toast("Backup inválido"); }
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

renderHome();

}, {once:true});
